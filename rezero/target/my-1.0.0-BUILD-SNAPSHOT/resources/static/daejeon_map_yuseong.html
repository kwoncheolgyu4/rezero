<html lang="en">
<head>
<meta charset="UTF-8">

<title>유성구</title>
<style>
/* 기본 브라우저 여백 제거 */
html, body {
	margin: 0;
	padding: 0;
	overflow: hidden; /* 스크롤 제거 */
}

/* SVG 설정 */
svg {
	width: 100vw; /* 화면 전체 너비 */
	height: 100vh; /* 화면 전체 높이 */
	/*background-color: #f0f0f0;*/ /* 배경색 설정 */
}

/* 고정된 층 스타일 */
.fixed-layer path {
	fill: transparent;
	pointer-events: all; /* 이벤트 활성화 */
	cursor: default;
}

/* 움직이는 층 스타일 */
.moving-layer path {
	fill: lightblue;
	stroke: black;
	stroke-width: 0.5;
	transition: transform 0.3s ease, filter 0.3s ease;
}

/* 호버 시 움직이는 층 효과 */
.moving-layer path.hovered {
	transform: translate(-8px, -8px);
	filter: drop-shadow(6px 6px rgba(0, 0, 0, 1))
		drop-shadow(4px 4px rgba(0, 0, 0, 1));
	fill: lightgreen;
}

/* 지도 스타일 */
/* .dong {
            fill: lightblue;
            stroke: black;
            stroke-width: 0.5;
            transform: translate(0, 0);
            filter: drop-shadow(0px 0px 0px rgba(0, 0, 0, 0)); 기본적으로 그림자 없음
            transition: transform 0.3s ease, filter 0.3s ease; 부드러운 효과
        } */

/* 마우스 오버 시 색상 변경 */
/* .dong:hover {
            fill: lightgreen;
            cursor: pointer;
            transform: translate(-8px, -8px);
            filter: drop-shadow(5px 5px rgba(0, 0, 0, 1)) 
                    drop-shadow(4px 4px rgba(0, 0, 0, 1));
        } */

/* 툴팁 스타일 */

.tooltip {
	position: absolute;
	background-color: rgba(0, 0, 0, 0.8);
	color: white;
	padding: 5px 10px;
	border-radius: 4px;
	font-size: 12px;
	pointer-events: none; /* 툴팁이 마우스 이벤트를 차단하지 않음 */
	white-space: nowrap;
	z-index: 10;
	display: none;
}
</style>

	<!-- 툴팁 -->
	<div id="tooltip" class="tooltip"></div>

	<script>

        // DOMContentLoaded 이벤트로 JavaScript 실행 타이밍 보장
        document.addEventListener('DOMContentLoaded', () => {
            // 고정된 층과 움직이는 층 그룹 선택
            const fixedLayer = document.querySelector('.fixed-layer');
            const movingLayer = document.querySelector('.moving-layer');

            // 각 층의 path 요소 가져오기
            const fixedPaths = Array.from(fixedLayer.querySelectorAll('path'));
            const movingPaths = Array.from(movingLayer.querySelectorAll('path'));

            // 고정된 path에 이벤트 추가
            fixedPaths.forEach((fixedPath, index) => {
                const movingPath = movingPaths[index]; // 순서대로 연결

                // 마우스 올릴 때
                fixedPath.addEventListener('mouseenter', () => {
                    if (movingPath) movingPath.classList.add('hovered');
                });

                // 마우스 벗어날 때
                fixedPath.addEventListener('mouseleave', () => {
                    if (movingPath) movingPath.classList.remove('hovered');
                });
            });
        });

        document.querySelectorAll('.fixed-layer .dong').forEach(fixedPath => {
            fixedPath.addEventListener('mouseenter', () => {
                // `id`를 기준으로 연결된 `moving-layer`의 path 찾기
                const id = fixedPath.id;

                // CSS 이스케이프 처리
                const escapedId = CSS.escape(id);

                const movingPath = document.querySelector(`.moving-layer .dong#${escapedId}`);

                if (movingPath) {
                    // `movingPath`를 `moving-layer`의 마지막으로 이동
                    movingPath.parentNode.appendChild(movingPath);
                }
            });
        });


        const tooltip = document.getElementById('tooltip');

        // 이벤트 핸들러 추가
        document.querySelectorAll('path.dong').forEach(path => {
            const name = path.getAttribute('data-name'); // 동 이름

            // 마우스 오버 시 툴팁 표시
            path.addEventListener('mouseover', (evt) => {
                tooltip.style.display = 'block';
                tooltip.textContent = name;
                moveTooltip(evt); // 툴팁 위치 업데이트
            });

            // 마우스 이동 시 툴팁 위치 업데이트
            path.addEventListener('mousemove', (evt) => {
                moveTooltip(evt);
            });

            // 마우스 아웃 시 툴팁 숨김
            path.addEventListener('mouseout', () => {
                tooltip.style.display = 'none';
            });
        });

        // 툴팁 위치 업데이트 함수
        function moveTooltip(evt) {
            tooltip.style.left = evt.pageX + 10 + 'px'; // 마우스 오른쪽 10px
            tooltip.style.top = evt.pageY + 10 + 'px';  // 마우스 아래 10px
        }
    </script>
